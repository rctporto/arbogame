name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# id-token: o GitHub emite um token que o Google aceita no lugar de uma chave
# (configurado uma vez com scripts/configurar-publicacao.sh).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/958314130866/locations/global/workloadIdentityPools/github/providers/github-arbogame
          service_account: github-deploy-arbogame@norio-pd-os.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publicar o site
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting --project norio-pd-os --non-interactive
